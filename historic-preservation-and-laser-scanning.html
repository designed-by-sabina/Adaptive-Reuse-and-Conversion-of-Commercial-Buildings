<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Historic Preservation and 3D Laser Scanning</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div class="stage light">
    <a class="back-link action-mark-host" href="directions.html">
      <span class="action-mark-group"><span class="action-mark"></span></span>
      <span class="action-mark-text">&larr; Map</span>
    </a>
    <img id="bg" class="bg" src="assets/page-historic-preservation.png" alt="Historic Preservation and 3D Laser Scanning" />
    <div id="chart-window" class="map-window chart-window" data-l="0.03" data-t="0.05" data-r="0.34" data-b="0.95">
      <div class="chart-window-inner">
        <h1 class="chart-title">Number of Landmarks out of<br>
          Potentially Convertible Office Buildings by Neighborhood</h1>
          <p class="chart-subtitle">Pie charts are weighted to the citywide maximum of 427 buildings, broken down by landmark status and construction era</p>
        <div id="pie-grid" class="pie-grid"></div>
      </div>
    </div>
    <div id="detail-window" class="detail-window" data-l="0.36" data-t="0.05" data-r="0.75" data-b="0.95">
      <div id="detail-view" class="detail-view">
        <p class="detail-placeholder">Click a neighborhood to see its breakdown</p>
        <div id="chart-legend" class="chart-legend"></div>
      </div>
    </div>
  </div>

  <script src="javascript/main.js"></script>
  <script>
    const bg = document.getElementById('bg');
    const chartWindow = document.getElementById('chart-window');
    const detailWindow = document.getElementById('detail-window');
    fitHotspots(bg, [chartWindow, detailWindow].map((el) => ({
      el,
      rect: {
        left: parseFloat(el.dataset.l),
        top: parseFloat(el.dataset.t),
        right: parseFloat(el.dataset.r),
        bottom: parseFloat(el.dataset.b),
      },
    })));

    const CITYWIDE_MAX = 427;
    const COLORS = { pre61Other: '#B7DDFD', y6190Other: '#FFD2A9', y6190Landmark: '#FC9E41', pre61Landmark: '#73C0FF' };
    const NEIGHBORHOODS = [
      { name: 'Midtown-Times Square', pre61Landmark: 13.8, y6190Landmark: 1.4, y6190Other: 16.4, pre61Other: 68.4, total: 427 },
      { name: 'Midtown South-Flatiron-Union Square', pre61Landmark: 3.4, y6190Landmark: 0.0, y6190Other: 1.7, pre61Other: 94.9, total: 356 },
      { name: 'SoHo-Little Italy-Hudson Square', pre61Landmark: 2.6, y6190Landmark: 0.0, y6190Other: 2.1, pre61Other: 95.4, total: 194 },
      { name: 'Tribeca-Civic Center', pre61Landmark: 15.4, y6190Landmark: 0.0, y6190Other: 7.7, pre61Other: 76.9, total: 117 },
      { name: 'Financial District-Battery Park City', pre61Landmark: 18.9, y6190Landmark: 1.8, y6190Other: 22.5, pre61Other: 56.8, total: 111 },
      { name: 'Chelsea-Hudson Yards', pre61Landmark: 0.0, y6190Landmark: 0.0, y6190Other: 0.0, pre61Other: 100.0, total: 102 },
      { name: 'East Midtown-Turtle Bay', pre61Landmark: 6.8, y6190Landmark: 2.3, y6190Other: 39.8, pre61Other: 51.1, total: 88 },
      { name: 'Chinatown-Two Bridges', pre61Landmark: 1.3, y6190Landmark: 0.0, y6190Other: 5.1, pre61Other: 93.6, total: 78 },
      { name: 'Greenwich Village', pre61Landmark: 16.9, y6190Landmark: 0.0, y6190Other: 0.0, pre61Other: 83.1, total: 77 },
      { name: 'Murray Hill-Kips Bay', pre61Landmark: 5.4, y6190Landmark: 1.8, y6190Other: 21.4, pre61Other: 71.4, total: 56 },
      { name: 'Upper East Side-Carnegie Hill', pre61Landmark: 1.9, y6190Landmark: 0.0, y6190Other: 9.3, pre61Other: 88.9, total: 54 },
      { name: 'Gramercy', pre61Landmark: 4.3, y6190Landmark: 0.0, y6190Other: 0.0, pre61Other: 95.7, total: 47 },
      { name: "Hell's Kitchen", pre61Landmark: 5.1, y6190Landmark: 0.0, y6190Other: 10.3, pre61Other: 84.6, total: 39 },
      { name: 'West Village', pre61Landmark: 2.7, y6190Landmark: 0.0, y6190Other: 0.0, pre61Other: 97.3, total: 37 },
      { name: 'Lower East Side', pre61Landmark: 0.0, y6190Landmark: 0.0, y6190Other: 9.1, pre61Other: 90.9, total: 22 },
      { name: 'East Harlem (North)', pre61Landmark: 5.0, y6190Landmark: 0.0, y6190Other: 0.0, pre61Other: 95.0, total: 20 },
      { name: 'Harlem (South)', pre61Landmark: 5.3, y6190Landmark: 0.0, y6190Other: 26.3, pre61Other: 68.4, total: 19 },
      { name: 'Upper West Side-Lincoln Square', pre61Landmark: 7.1, y6190Landmark: 0.0, y6190Other: 0.0, pre61Other: 92.9, total: 14 },
      { name: 'Manhattanville-West Harlem', pre61Landmark: 0.0, y6190Landmark: 0.0, y6190Other: 23.1, pre61Other: 76.9, total: 13 },
      { name: 'Upper East Side-Lenox Hill-Roosevelt Island', pre61Landmark: 0.0, y6190Landmark: 0.0, y6190Other: 16.7, pre61Other: 83.3, total: 12 },
      { name: 'Upper East Side-Yorkville', pre61Landmark: 0.0, y6190Landmark: 0.0, y6190Other: 27.3, pre61Other: 72.7, total: 11 },
      { name: 'Washington Heights (South)', pre61Landmark: 0.0, y6190Landmark: 0.0, y6190Other: 0.0, pre61Other: 100.0, total: 6 },
      { name: 'East Village', pre61Landmark: 0.0, y6190Landmark: 0.0, y6190Other: 0.0, pre61Other: 100.0, total: 6 },
      { name: 'Upper West Side (Central)', pre61Landmark: 0.0, y6190Landmark: 0.0, y6190Other: 0.0, pre61Other: 100.0, total: 5 },
      { name: 'Inwood', pre61Landmark: 0.0, y6190Landmark: 0.0, y6190Other: 0.0, pre61Other: 100.0, total: 4 },
      { name: 'Washington Heights (North)', pre61Landmark: 0.0, y6190Landmark: 0.0, y6190Other: 0.0, pre61Other: 100.0, total: 2 },
      { name: 'East Harlem (South)', pre61Landmark: 0.0, y6190Landmark: 0.0, y6190Other: 0.0, pre61Other: 100.0, total: 2 },
      { name: 'Harlem (North)', pre61Landmark: 0.0, y6190Landmark: 0.0, y6190Other: 0.0, pre61Other: 100.0, total: 1 },
      { name: 'The Battery-Governors Island-Ellis Island-Liberty Island', pre61Landmark: 0.0, y6190Landmark: 0.0, y6190Other: 0.0, pre61Other: 100.0, total: 1 },
    ];

    const R = 35;
    const CIRC = 2 * Math.PI * R;

    function arc(lengthPct, offsetPct, color, name, pct, cnt) {
      const len = (lengthPct / 100) * CIRC;
      return `<circle class="pie-seg" cx="50" cy="50" r="${R}" fill="none" stroke="${color}"
        stroke-width="14" stroke-dasharray="${len} ${CIRC - len}" stroke-dashoffset="${-(offsetPct / 100) * CIRC}"
        data-name="${name}" data-pct="${pct}" data-count="${cnt}">
        <title>${name}: ${pct}% (${cnt} bldgs)</title>
      </circle>`;
    }

    // kept small enough that the 1.08x "exploded" scale (see .pie-seg.exploded)
    // never pushes a wedge past the svg's own 100x100 viewBox — an ancestor
    // (.detail-view) has overflow-y:auto, which per the CSS overflow spec
    // forces its overflow-x to compute as auto too, clipping anything that
    // relies on `overflow: visible` to bleed past its own box.
    const PIE_R = 45;
    function polarPoint(angleDeg) {
      // no -90 shift here: wedge() output is wrapped in the same
      // `rotate(-90 50 50)` group as the ring arcs, which already
      // rotates the start point from 3 o'clock to 12 o'clock.
      const a = angleDeg * Math.PI / 180;
      return { x: 50 + PIE_R * Math.cos(a), y: 50 + PIE_R * Math.sin(a) };
    }

    function wedge(lengthPct, offsetPct, color, name, pct, cnt) {
      if (lengthPct <= 0) return '';
      const startAngle = (offsetPct / 100) * 360;
      const endAngle = ((offsetPct + lengthPct) / 100) * 360;
      const start = polarPoint(startAngle);
      const end = polarPoint(endAngle);
      const largeArc = endAngle - startAngle > 180 ? 1 : 0;
      const d = `M 50 50 L ${start.x} ${start.y} A ${PIE_R} ${PIE_R} 0 ${largeArc} 1 ${end.x} ${end.y} Z`;
      return `<path class="pie-seg pie-wedge" d="${d}" fill="${color}" stroke="#013984" stroke-width="0.5"
        data-name="${name}" data-pct="${pct}" data-count="${cnt}">
        <title>${name}: ${pct}% (${cnt} bldgs)</title>
      </path>`;
    }

    function count(pct, total) {
      return Math.round((pct / 100) * total);
    }

    function landmarksTotal(n) {
      return count(n.pre61Landmark, n.total) + count(n.y6190Landmark, n.total);
    }

    function donutMarkup(n, size, showTotal, asPie) {
      const scale = n.total / CITYWIDE_MAX;
      const lenD = n.pre61Other * scale;
      const lenC = n.y6190Other * scale;
      const lenB = n.y6190Landmark * scale;
      const lenA = n.pre61Landmark * scale;
      let cursor = 0;
      const parts = [
        [lenD, COLORS.pre61Other, 'Pre-1961 Other', n.pre61Other],
        [lenC, COLORS.y6190Other, '1961–1990 Other', n.y6190Other],
        [lenB, COLORS.y6190Landmark, '1961–1990 Landmark', n.y6190Landmark],
        [lenA, COLORS.pre61Landmark, 'Pre-1961 Landmark', n.pre61Landmark],
      ];
      const segs = parts.map(([len, color, name, pct]) => {
        const el = asPie
          ? wedge(len, cursor, color, name, pct, count(pct, n.total))
          : (len > 0 ? arc(len, cursor, color, name, pct, count(pct, n.total)) : '');
        cursor += len;
        return el;
      }).join('');
      const background = asPie
        ? '<circle cx="50" cy="50" r="' + PIE_R + '" fill="none" stroke="#013984" stroke-width="0.5"></circle>'
        : '<circle cx="50" cy="50" r="' + R + '" fill="none" stroke="#ffffff" stroke-width="14"></circle>';
      return `
        <div class="pie-chart-wrap" style="max-width:${size}px">
          <svg class="pie-chart" style="max-width:${size}px" viewBox="0 0 100 100">
            ${background}
            <g transform="rotate(-90 50 50)">${segs}</g>
            ${showTotal ? `<text x="50" y="50" class="pie-total" text-anchor="middle" dominant-baseline="central">${landmarksTotal(n)}</text>` : ''}
          </svg>
        </div>`;
    }

    function setCellHighlighted(cell, on) {
      cell.querySelectorAll('.pie-mark-group').forEach((g) => g.classList.toggle('group-hover', on));
    }

    function totalRowMarkup(n) {
      return `
        <div class="legend-total-block">
          <div class="legend-total-line pie-mark-host">
            <span class="pie-mark-group"></span>
            <span class="pie-mark-text">Total Number of Potentially Convertible Office Buildings &mdash; ${n.total}</span>
          </div>
          <div class="legend-total-line pie-mark-host">
            <span class="pie-mark-group"></span>
            <span class="pie-mark-text">Total number of Landmark Buildings &mdash; ${landmarksTotal(n)}</span>
          </div>
        </div>`;
    }

    function legendMarkup(n) {
      const rows = [
        ['Pre-1961 Landmark', COLORS.pre61Landmark, 'Landmark Built Pre-1961', count(n.pre61Landmark, n.total)],
        ['1961–1990 Landmark', COLORS.y6190Landmark, 'Landmark Built 1961–1990', count(n.y6190Landmark, n.total)],
        ['Pre-1961 Other', COLORS.pre61Other, 'Built Pre-1961 (No Landmark Status)', count(n.pre61Other, n.total)],
        ['1961–1990 Other', COLORS.y6190Other, 'Built 1961–1990 (No Landmark Status)', count(n.y6190Other, n.total)],
      ];
      return rows.map(([name, color, title, cnt], i) => `
        <div class="legend-row${i === 1 ? ' legend-row-break' : ''}" data-name="${name}">
          <i style="background:${color}"></i>
          <span class="legend-text pie-mark-host">
            <span class="pie-mark-group"></span>
            <span class="pie-mark-text">${title} &mdash; ${cnt}</span>
          </span>
        </div>`).join('');
    }

    const detailView = document.getElementById('detail-view');
    function showDetail(n, cellEl) {
      document.querySelectorAll('.pie-cell.selected').forEach((el) => {
        el.classList.remove('selected');
        setCellHighlighted(el, el.matches(':hover'));
      });
      if (cellEl) {
        cellEl.classList.add('selected');
        setCellHighlighted(cellEl, true);
      }
      detailView.innerHTML = `
        <div class="detail-donut">${donutMarkup(n, 368, false, true)}</div>
        <h2 class="detail-name">${n.name}</h2>
        ${totalRowMarkup(n)}
        <div id="chart-legend" class="chart-legend">${legendMarkup(n)}</div>`;
      detailView.querySelectorAll('.pie-mark-host').forEach(buildTextMarks);
    }

    detailView.addEventListener('click', (e) => {
      const seg = e.target.closest('.pie-seg');
      if (!seg) return;
      detailView.querySelectorAll('.pie-seg.exploded').forEach((s) => s.classList.remove('exploded'));
      seg.classList.add('exploded');
      detailView.querySelectorAll('.legend-row').forEach((row) => {
        const on = row.dataset.name === seg.dataset.name;
        row.querySelectorAll('.pie-mark-group').forEach((g) => g.classList.toggle('group-hover', on));
      });
    });

    const grid = document.getElementById('pie-grid');
    grid.innerHTML = NEIGHBORHOODS.map((n, i) => `
        <div class="pie-cell" data-index="${i}">
          ${donutMarkup(n, 160, true)}
          <div class="pie-caption">
            <div class="pie-label pie-mark-host"><div class="pie-mark-group"></div><span class="pie-mark-text">${n.name}</span></div>
            <div class="pie-landmarks pie-mark-host"><div class="pie-mark-group"></div><span class="pie-mark-text">out of ${n.total}</span></div>
          </div>
        </div>`).join('');

    function buildTextMarks(host) {
      const target = host.querySelector('.pie-mark-text');
      const group = host.querySelector('.pie-mark-group');
      const range = document.createRange();
      range.selectNodeContents(target);
      const groupRect = group.getBoundingClientRect();
      Array.from(range.getClientRects()).forEach((r) => {
        const mark = document.createElement('div');
        mark.className = 'pie-mark';
        mark.style.left = (r.left - groupRect.left) + 'px';
        mark.style.top = (r.top - groupRect.top) + 'px';
        mark.style.width = r.width + 'px';
        mark.style.height = r.height + 'px';
        group.appendChild(mark);
      });
    }
    grid.querySelectorAll('.pie-mark-host').forEach(buildTextMarks);

    grid.querySelectorAll('.pie-cell').forEach((cell) => {
      cell.addEventListener('mouseenter', () => setCellHighlighted(cell, true));
      cell.addEventListener('mouseleave', () => setCellHighlighted(cell, cell.classList.contains('selected')));
      cell.addEventListener('click', () => showDetail(NEIGHBORHOODS[+cell.dataset.index], cell));
    });

    showDetail(NEIGHBORHOODS[0], grid.querySelector('.pie-cell'));
  </script>
</body>
</html>
